<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>SketchUp PWA</title>

    <!-- ✅ Style global avec image de fond -->
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: url("images/background.jpg") center/cover no-repeat fixed;
        color: white;
      }

      .logo {
        width: 280px;
        margin: 0 auto 16px;
        display: block;
      }

      .card {
        max-width: 450px;
        margin: 40px auto;
        padding: 32px;
        background-color: rgba(0, 0, 0, 0.65);
        border-radius: 12px;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: visible;
      }

      input[type="number"],
      select {
        font-size: 16px;
        background-color: #1f2937;
        color: white;
        padding: 12px;
        width: 100%;
        border: none;
        border-radius: 6px;
        margin-bottom: 12px;
      }

      button {
        cursor: pointer;
        padding: 10px 16px;
        font-size: 16px;
        border-radius: 6px;
      }

      .result-box {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 16px;
        border-radius: 8px;
        margin-top: 24px;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
  <script defer src="bundle.df7364925bbef716e5bc.js"></script></body>
</html>
