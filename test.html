<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d6efd" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Vérification Pergola</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: url("images/background.jpg") center/cover no-repeat fixed;
      color: white;
    }

    .logo {
      width: 180px;
      display: block;
      margin: 24px auto;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: rgba(0,0,0,0.65);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 16px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      color: #7fd0ff;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 16px 0 6px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    button {
      width: 100%;
      margin-top: 20px;
      background: #0d6efd;
      color: white;
      font-weight: bold;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .result-box {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 8px;
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <img src="images/logo.png" alt="Logo" class="logo" />
  <div class="card">
    <h1>Vérification Pergola</h1>

    <label>Type de lames</label>
    <select id="type">
      <option value="lames_simples">Lames simples</option>
      <option value="lames_tubulaires">Lames tubulaires</option>
    </select>

    <label>Configuration</label>
    <select id="config">
      <option value="1_poutre_1_verin">1 poutre 1 vérin</option>
      <option value="1_poutre_2_verins">1 poutre 2 vérins</option>
      <option value="2_poutres_2_verins">2 poutres 2 vérins</option>
    </select>

    <label>Longueur (mm)</label>
    <input id="longueur" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Ex: 4000" />

    <label>Avancée (mm)</label>
    <input id="avancee" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Ex: 3000" />

    <button onclick="valider()">Valider</button>

    <div id="resultat" class="result-box"></div>
  </div>

  <script>
    async function valider() {
      const type = document.getElementById('type').value;
      const config = document.getElementById('config').value;
      const longueur = parseInt(document.getElementById('longueur').value);
      const avancee = parseInt(document.getElementById('avancee').value);
      const box = document.getElementById('resultat');
      box.innerHTML = '';

      if (isNaN(longueur) || isNaN(avancee)) {
        box.textContent = "Veuillez entrer des valeurs valides.";
        return;
      }

      try {
        const res = await fetch(`rules/${type}/${config}.json`);
        if (!res.ok) throw new Error("Fichier JSON introuvable");
        const data = await res.json();

        const iLong = data.longueurs.findIndex(val => val >= longueur);
        const iAv = data.avancees.findIndex(val => val >= avancee);
        const nbLames = data.lames_par_longueur[iLong] ?? "?";

        let couleur = "hors";
        if (iAv !== -1 && iLong !== -1 && data.couleurs[iAv]?.[iLong]) {
          couleur = data.couleurs[iAv][iLong];
        }

        let pente = "❌ Hors limites dimensionnelles";
        if (couleur === "vert") pente = "✅ Pas de pente requise";
        else if (couleur === "jaune") pente = "⚠️ Pente de 5 mm/m requise";
        else if (couleur === "orange") pente = "⚠️ Pente de 8 mm/m requise";

        let poteau = "✅ Aucun poteau requis";
        if (couleur === "hors" || iAv === -1 || iLong === -1) {
          poteau = "❌ Hors limites dimensionnelles";
          pente = "❌ Hors limites dimensionnelles";
        } else {
          const avRule = data.poteau_si_avancee?.find(r =>
            avancee >= r.avancee_min && avancee <= r.avancee_max && longueur >= r.longueur_seuil
          );
          const lRule = data.poteau_si_longueur?.find(r =>
            longueur >= r.longueur_min && longueur <= r.longueur_max && avancee >= r.avancee_seuil
          );
          if (avRule || lRule) poteau = "⚠️ Poteau intermédiaire obligatoire";
        }

        const surface = ((longueur * avancee) / 1_000_000).toFixed(2);

        box.innerHTML = `
          <p><strong>Dimensions :</strong> ${longueur} x ${avancee} mm</p>
          <p><strong>Surface :</strong> ${surface} m²</p>
          <p><strong>Nombre de lames :</strong> ${nbLames}</p>
          <p><strong>Couleur :</strong> ${couleur.toUpperCase()}</p>
          <p><strong>Pente :</strong> ${pente}</p>
          <p><strong>Poteau :</strong> ${poteau}</p>
        `;

        if (navigator.vibrate) navigator.vibrate(50);
      } catch (err) {
        console.error(err);
        box.textContent = "Erreur de chargement ou de traitement du fichier JSON.";
      }
    }
  </script>
</body>
</html>
